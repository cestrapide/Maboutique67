<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Boutique</title>
<style>
:root{--bg:#14110a;--card:#231d0e;--line:#4a3d16;--gold:#e6c244;--txt:#f3efe2;--mut:#a89f84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf6e8;--card:#fff;--line:#e0d29a;--gold:#b8901a;--txt:#2a2410;--mut:#7a7258}}
:root[data-theme="dark"]{--bg:#14110a;--card:#231d0e;--line:#4a3d16;--gold:#e6c244;--txt:#f3efe2;--mut:#a89f84}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;display:flex;flex-direction:column}
header{text-align:center;padding:14px 12px 6px}
h1{margin:0;font-size:22px;color:var(--gold);letter-spacing:1px}
.pill{display:inline-block;margin-top:8px;padding:6px 14px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--mut)}
main{flex:1;overflow-y:auto;padding:10px 14px 16px}
.bar{display:flex;gap:8px;margin-bottom:10px}
input,select{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;padding:12px;font-size:15px;min-width:0}
input{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px}
.chip{flex:none;padding:8px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:13px}
.chip.on{background:var(--gold);color:#1a1405;border-color:var(--gold);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.emo{font-size:52px;line-height:1.3}
.name{font-size:14px;margin:4px 0}
.price{color:var(--gold);font-weight:700}
button{font:inherit;cursor:pointer}
.add{margin-top:8px;width:100%;padding:9px;border:0;border-radius:12px;background:var(--gold);color:#1a1405;font-weight:700}
.empty{text-align:center;padding:50px 10px;color:var(--mut)}
.empty b{display:block;font-size:44px;color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.row .grow{flex:1}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--txt)}
.tot{display:flex;justify-content:space-between;font-size:18px;margin:14px 2px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:11px;padding:6px 0;position:relative;border-radius:12px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--gold);background:rgba(230,194,68,.12)}
.badge{position:absolute;top:0;right:14%;background:var(--gold);color:#1a1405;border-radius:10px;font-size:10px;padding:1px 6px;font-weight:700}
.link{display:block;text-align:center;margin-top:10px;padding:14px;border-radius:14px;background:var(--gold);color:#1a1405;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><h1>MA BOUTIQUE</h1><div class="pill">● <span id="count"></span></div></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
var P=[
{id:1,n:"Casquette noire",c:"Casquettes",p:19,e:"🧢"},
{id:2,n:"Casquette beige",c:"Casquettes",p:21,e:"🧢"},
{id:3,n:"T-shirt blanc",c:"T-shirts",p:25,e:"👕"},
{id:4,n:"T-shirt noir",c:"T-shirts",p:25,e:"👕"},
{id:5,n:"Hoodie gris",c:"Pulls",p:49,e:"🧥"},
{id:6,n:"Jean droit",c:"Pantalons",p:59,e:"👖"},
{id:7,n:"Montre classique",c:"Montres",p:89,e:"⌚"},
{id:8,n:"Montre sport",c:"Montres",p:69,e:"⌚"}];
var CATS=["Casquettes","T-shirts","Pulls","Pantalons","Montres"];
var S={tab:"shop",q:"",cat:"",sort:"",cart:{},hist:[]};
var TABS=[["shop","🔎","Boutique"],["cats","▦","Catégories"],["cart","🛒","Panier"],["hist","🕘","Historique"],["help","💬","Contact"],["me","👤","Profil"]];
function $(i){return document.getElementById(i)}
function list(){
 var r=P.filter(function(x){return (!S.cat||x.c===S.cat)&&x.n.toLowerCase().indexOf(S.q.toLowerCase())>-1});
 if(S.sort==="asc")r.sort(function(a,b){return a.p-b.p});
 if(S.sort==="desc")r.sort(function(a,b){return b.p-a.p});
 return r}
function nbCart(){var n=0;for(var k in S.cart)n+=S.cart[k];return n}
function grid(){
 var r=list(),h="";
 if(!r.length)h='<div class="empty"><b>✕</b>Aucun produit trouvé<br><br><button class="add" onclick="S.q=\'\';S.cat=\'\';render()">Effacer la recherche</button></div>';
 else h='<div class="grid">'+r.map(function(x){return '<div class="card"><div class="emo">'+x.e+'</div><div class="name">'+x.n+'</div><div class="price">'+x.p+' €</div><button class="add" onclick="add('+x.id+')">Ajouter</button></div>'}).join("")+'</div>';
 $("grid").innerHTML=h}
function add(id){S.cart[id]=(S.cart[id]||0)+1;nav()}
function chg(id,d){S.cart[id]=(S.cart[id]||0)+d;if(S.cart[id]<=0)delete S.cart[id];render()}
function total(){var t=0;for(var k in S.cart){t+=S.cart[k]*P.filter(function(x){return x.id==k})[0].p}return t}
function order(){
 if(!nbCart())return;
 S.hist.unshift({d:new Date().toLocaleString("fr-FR"),t:total(),n:nbCart()});
 S.cart={};S.tab="hist";render()}
function nav(){
 $("nav").innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" onclick="S.tab=\''+t[0]+'\';render()"><span>'+t[1]+'</span>'+t[2]+(t[0]==="cart"&&nbCart()?'<i class="badge">'+nbCart()+'</i>':"")+'</button>'}).join("")}
function render(){
 nav();$("count").textContent=P.length+" PRODUITS · "+CATS.length+" CATÉGORIES";
 var m=$("main"),h="";
 if(S.tab==="shop"){
  h='<div class="bar"><input id="q" placeholder="Rechercher…" value="'+S.q.replace(/"/g,"&quot;")+'"><select id="s"><option value="">Tri</option><option value="asc">Prix ↑</option><option value="desc">Prix ↓</option></select></div>';
  h+='<div class="chips"><button class="chip'+(S.cat?"":" on")+'" onclick="S.cat=\'\';render()">Tout</button>'+CATS.map(function(c){return '<button class="chip'+(S.cat===c?" on":"")+'" onclick="S.cat=\''+c+'\';render()">'+c+'</button>'}).join("")+'</div><div id="grid"></div>';
  m.innerHTML=h;grid();$("s").value=S.sort;
  $("q").oninput=function(e){S.q=e.target.value;grid()};
  $("s").onchange=function(e){S.sort=e.target.value;grid()};
 }else if(S.tab==="cats"){
  m.innerHTML='<div class="grid">'+CATS.map(function(c){var e=P.filter(function(x){return x.c===c})[0].e;return '<div class="card" onclick="S.cat=\''+c+'\';S.tab=\'shop\';render()"><div class="emo">'+e+'</div><div class="name">'+c+'</div></div>'}).join("")+'</div>';
 }else if(S.tab==="cart"){
  if(!nbCart())h='<div class="empty"><b>🛒</b>Ton panier est vide</div>';
  else{h=Object.keys(S.cart).map(function(k){var x=P.filter(function(y){return y.id==k})[0];return '<div class="row"><span class="emo" style="font-size:30px">'+x.e+'</span><div class="grow">'+x.n+'<br><span class="price">'+x.p+' €</span></div><div class="qty"><button onclick="chg('+k+',-1)">−</button> '+S.cart[k]+' <button onclick="chg('+k+',1)">+</button></div></div>'}).join("");
   h+='<div class="tot"><span>Total</span><b class="price">'+total()+' €</b></div><button class="add" style="padding:14px" onclick="order()">Commander</button>'}
  m.innerHTML=h;
 }else if(S.tab==="hist"){
  m.innerHTML=S.hist.length?S.hist.map(function(o){return '<div class="row"><div class="grow">'+o.d+'<br>'+o.n+' article(s)</div><b class="price">'+o.t+' €</b></div>'}).join(""):'<div class="empty"><b>🕘</b>Aucune commande</div>';
 }else if(S.tab==="help"){
  m.innerHTML='<div class="empty">Une question ? Écris-nous.</div><a class="link" href="#">Contacter le support</a>';
 }else{
  m.innerHTML='<div class="empty"><b>👤</b>Profil<br>Ici viendront le nom et les infos Telegram.</div>'}
}
render();
</script>
</body>
</html>
